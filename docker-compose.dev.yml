# 로컬 개발·테스트용 PostgreSQL. 운영 배포와 무관하다.
#   docker compose -f docker-compose.dev.yml up -d
#   TEST_DATABASE_URL=postgresql://jobtrend:jobtrend@127.0.0.1:54329/jobtrend_test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobtrend
      POSTGRES_PASSWORD: jobtrend
      POSTGRES_DB: jobtrend_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrend -d jobtrend_test"]
      interval: 2s
      timeout: 3s
      retries: 30
